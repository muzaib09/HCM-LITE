<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payslip | HCM Lite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body class="auth-pending">
  <div class="app" id="app">
    <aside id="sidebar" class="sidebar"></aside>
    <div id="overlay" class="overlay"></div>
    <div class="main">
      <header id="topbar" class="topbar"></header>
      <main class="content">
        <section class="card no-print">
          <div class="toolbar" style="margin-bottom:0">
            <div class="field" style="margin:0" id="employeePickerField"><label for="payEmployee">Employee</label><select id="payEmployee"></select></div>
            <div class="field" style="margin:0"><label for="payMonth">Month</label><select id="payMonth"></select></div>
            <div class="field" style="margin:0"><label for="payYear">Year</label><select id="payYear"></select></div>
            <button type="button" class="btn btn-primary" id="printBtn" style="margin-left:auto"></button>
          </div>
        </section>
        <div class="payslip-stage" id="payslipStage"></div>
      </main>
    </div>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/helper.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/employees.js"></script>
  <script src="js/leave.js"></script>
  <script src="js/attendance.js"></script>
  <script src="js/payroll.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/payslip-page.js"></script>
</body>
</html>
