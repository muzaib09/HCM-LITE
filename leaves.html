<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leave | HCM Lite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body class="auth-pending">
  <div class="app" id="app">
    <aside id="sidebar" class="sidebar"></aside>
    <div id="overlay" class="overlay"></div>
    <div class="main">
      <header id="topbar" class="topbar"></header>
      <main class="content">
        <!-- Employee view -->
        <div id="employeeLeaveView" hidden>
          <section class="stat-grid" id="leaveBalance" aria-label="Leave balance"></section>
          <div class="grid-2" style="margin-top:20px">
            <section class="card" aria-labelledby="applyTitle">
              <div class="card-head"><h2 id="applyTitle">Apply for leave</h2></div>
              <form id="leaveForm" novalidate>
                <div class="field"><label for="leaveType">Leave type</label><select id="leaveType"></select><span class="field-error" id="leaveTypeError"></span></div>
                <div class="form-row">
                  <div class="field"><label for="leaveStartDate">Start date</label><input id="leaveStartDate" type="date"><span class="field-error" id="leaveStartDateError"></span></div>
                  <div class="field"><label for="leaveEndDate">End date</label><input id="leaveEndDate" type="date"><span class="field-error" id="leaveEndDateError"></span></div>
                </div>
                <p class="hint" id="leaveDaysPreview" style="margin-bottom:14px" aria-live="polite"></p>
                <div class="field"><label for="leaveReason">Reason</label><textarea id="leaveReason" maxlength="300"></textarea><span class="field-error" id="leaveReasonError"></span></div>
                <button class="btn btn-primary" type="submit">Send request</button>
              </form>
            </section>
            <section class="card">
              <div class="card-head"><h2>My requests</h2></div>
              <div id="myLeaves"></div>
            </section>
          </div>
        </div>

        <!-- Admin view -->
        <div id="adminLeaveView" hidden>
          <section class="card" style="margin-bottom:20px">
            <div class="card-head"><h2>Record emergency leave</h2></div>
            <p class="muted" style="margin-bottom:16px">If an employee cannot submit a request during an emergency, the admin can record it here. The leave will be saved as approved.</p>
            <form id="adminLeaveForm" novalidate>
              <div class="form-row">
                <div class="field"><label for="adminLeaveEmployee">Employee</label><select id="adminLeaveEmployee"><option value="">Choose employee</option></select><span class="field-error" id="adminLeaveEmployeeError"></span></div>
                <div class="field"><label for="adminLeaveType">Leave type</label><select id="adminLeaveType"><option value="">Choose type</option></select><span class="field-error" id="adminLeaveTypeError"></span></div>
              </div>
              <div class="form-row">
                <div class="field"><label for="adminLeaveStartDate">Start date</label><input id="adminLeaveStartDate" type="date"><span class="field-error" id="adminLeaveStartDateError"></span></div>
                <div class="field"><label for="adminLeaveEndDate">End date</label><input id="adminLeaveEndDate" type="date"><span class="field-error" id="adminLeaveEndDateError"></span></div>
              </div>
              <div class="field"><label for="adminLeaveReason">Reason</label><textarea id="adminLeaveReason" maxlength="300"></textarea><span class="field-error" id="adminLeaveReasonError"></span></div>
              <button class="btn btn-primary" type="submit">Record approved leave</button>
            </form>
          </section>
          <section class="card">
            <div class="toolbar">
              <label for="leaveStatusFilter" class="sr-only">Filter by status</label>
              <select id="leaveStatusFilter">
                <option value="Pending">Pending</option>
                <option value="Approved">Approved</option>
                <option value="Rejected">Rejected</option>
                <option value="All">All requests</option>
              </select>
              <span class="muted" id="leaveCounts"></span>
            </div>
            <div id="allLeaves"></div>
          </section>
        </div>

        <dialog id="reviewDialog" class="dialog" aria-labelledby="reviewTitle">
          <form id="reviewForm" novalidate>
            <div class="dialog-body">
              <div class="dialog-head"><h2 id="reviewTitle">Review leave request</h2><button type="button" class="icon-btn dialog-close" aria-label="Close" id="reviewClose"></button></div>
              <div class="review-summary" id="reviewSummary"></div>
              <div class="field"><label for="reviewComment">Comment</label><textarea id="reviewComment" maxlength="300"></textarea><span class="hint">Required when rejecting. Optional when approving.</span><span class="field-error" id="reviewCommentError"></span></div>
            </div>
            <div class="dialog-actions">
              <button type="button" class="btn btn-ghost dialog-close">Cancel</button>
              <button type="button" class="btn btn-danger" id="rejectBtn">Reject</button>
              <button type="button" class="btn btn-good" id="approveBtn">Approve</button>
            </div>
          </form>
        </dialog>
      </main>
    </div>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/helper.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/employees.js"></script>
  <script src="js/leave.js"></script>
  <script src="js/attendance.js"></script>
  <script src="js/payroll.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/leaves-page.js"></script>
</body>
</html>
