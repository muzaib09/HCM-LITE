<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employees | HCM Lite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body class="auth-pending">
  <div class="app" id="app">
    <aside id="sidebar" class="sidebar"></aside>
    <div id="overlay" class="overlay"></div>
    <div class="main">
      <header id="topbar" class="topbar"></header>
      <main class="content">
        <section class="card">
          <div class="toolbar">
            <div class="search-box">
              <label for="searchInput" class="sr-only">Search employees</label>
              <span id="searchIcon"></span>
              <input id="searchInput" type="search" placeholder="Search by name, email or department">
            </div>
            <label for="departmentFilter" class="sr-only">Filter by department</label>
            <select id="departmentFilter"><option value="">All departments</option></select>
            <button type="button" class="btn btn-primary" id="addEmployeeBtn"></button>
          </div>
          <div id="employeeTable"></div>
        </section>

        <dialog id="employeeDialog" class="dialog" aria-labelledby="employeeDialogTitle">
          <form id="employeeForm" novalidate>
            <div class="dialog-body">
              <div class="dialog-head"><h2 id="employeeDialogTitle">Add employee</h2><button type="button" class="icon-btn dialog-close" aria-label="Close" id="employeeDialogClose"></button></div>
              <div class="form-row">
                <div class="field"><label for="empName">Full name</label><input id="empName" type="text" autocomplete="off"><span class="field-error" id="empNameError"></span></div>
                <div class="field"><label for="empEmail">Email (login)</label><input id="empEmail" type="email" autocomplete="off"><span class="field-error" id="empEmailError"></span></div>
              </div>
              <div class="field"><label for="empPassword" id="empPasswordLabel">Password</label><input id="empPassword" type="password" autocomplete="new-password"><span class="hint" id="empPasswordHint">At least 8 characters with a letter and a number.</span><span class="field-error" id="empPasswordError"></span></div>
              <div class="form-row">
                <div class="field"><label for="empDepartment">Department</label><input id="empDepartment" type="text" list="departmentList" placeholder="e.g. Engineering"><datalist id="departmentList"></datalist><span class="field-error" id="empDepartmentError"></span></div>
                <div class="field"><label for="empDesignation">Job title (optional)</label><input id="empDesignation" type="text"></div>
              </div>
              <div class="form-row">
                <div class="field"><label for="empSalary">Monthly salary (Rs)</label><input id="empSalary" type="number" min="0" step="0.01" inputmode="decimal"><span class="field-error" id="empSalaryError"></span></div>
                <div class="field"><label for="empJoinDate">Joining date</label><input id="empJoinDate" type="date"><span class="field-error" id="empJoinDateError"></span></div>
              </div>
            </div>
            <div class="dialog-actions">
              <button type="button" class="btn btn-ghost dialog-close">Cancel</button>
              <button type="submit" class="btn btn-primary" id="employeeSaveBtn">Save employee</button>
            </div>
          </form>
        </dialog>
      </main>
    </div>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/helper.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/employees.js"></script>
  <script src="js/leave.js"></script>
  <script src="js/attendance.js"></script>
  <script src="js/payroll.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/employees-page.js"></script>
</body>
</html>
